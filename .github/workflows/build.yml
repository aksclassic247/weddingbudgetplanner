name: Build StitchBook

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android tests and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stitchbook/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run logic tests
        run: ./gradlew :core:test --no-daemon

      - name: Build debug app
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: stitchbook-debug-apk
          path: stitchbook/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: stitchbook/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for the iOS simulator
        run: |
          xcodebuild \
            -project StitchBook.xcodeproj \
            -scheme StitchBook \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
