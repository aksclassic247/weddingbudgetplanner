# Generates StitchBook.xcodeproj. Install once with: brew install xcodegen
# Then run from the ios folder: xcodegen generate
name: StitchBook
options:
  bundleIdPrefix: com.stitchbook
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StitchBook:
    type: application
    platform: iOS
    sources:
      - path: StitchBook
    resources:
      # The same content file the Android app reads.
      - path: ../shared/content.json
    info:
      path: StitchBook/Info.plist
      properties:
        CFBundleDisplayName: StitchBook
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stitchbook.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
